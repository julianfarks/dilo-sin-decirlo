name: Build y pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validar catálogo de cartas
        run: python3 tools/cards.py validate

      - name: Pruebas unitarias, APK debug y release
        id: gradle
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Guardar APK y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dilo-sin-decirlo
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/tests/**
            build.log
          if-no-files-found: ignore

      - name: Publicar APK en una Release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dilo-sin-decirlo-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dilo-sin-decirlo-release.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dilo-sin-decirlo-debug.apk dilo-sin-decirlo-release.apk \
            --title "Última compilación" \
            --notes "APK generados automáticamente por GitHub Actions (commit ${GITHUB_SHA::7}). El APK release usa la clave de depuración del repositorio: sirve para instalar y probar, no para Google Play."

      - name: Subir registro de errores a la rama ci-logs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/cilogs && mkdir -p /tmp/cilogs
          cp build.log /tmp/cilogs/ 2>/dev/null || echo "sin build.log (fallo antes de Gradle)" > /tmp/cilogs/build.log
          cp -r app/build/reports/tests /tmp/cilogs/tests 2>/dev/null || true
          cd /tmp/cilogs
          git init -q -b ci-logs
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "Registro de CI ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
