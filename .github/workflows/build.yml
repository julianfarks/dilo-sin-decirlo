name: Build y pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Validar catálogo de cartas
        run: python3 tools/cards.py validate

      - name: Pruebas unitarias, APK debug y release
        id: gradle
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Guardar APK y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dilo-sin-decirlo
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/tests/**
            build.log
          if-no-files-found: ignore

      - name: Publicar APK en una Release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dilo-sin-decirlo-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dilo-sin-decirlo-release.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dilo-sin-decirlo-debug.apk dilo-sin-decirlo-release.apk \
            --title "Última compilación" \
            --notes "APK generados automáticamente por GitHub Actions (commit ${GITHUB_SHA::7}). El APK release usa la clave de depuración del repositorio: sirve para instalar y probar, no para Google Play."

      - name: Subir registro de errores a la rama ci-logs
        if: failure()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/logs && cp build.log /tmp/logs/build.log 2>/dev/null || true
          cp -r app/build/reports/tests /tmp/logs/tests 2>/dev/null || true
          git checkout --orphan ci-logs
          git rm -rf . >/dev/null 2>&1 || true
          cp -r /tmp/logs/. .
          git add -A
          git commit -m "Registro de CI para ${GITHUB_SHA::7}" || true
          git push -f origin ci-logs
